# nginx config for www.perishflow.com on the Hostinger VPS (srv1047573, 72.60.203.152).
#
# Prerequisite: BigRock DNS for perishflow.com and www.perishflow.com points at 72.60.203.152.
#
# Install (certificate first: nginx -t fails while the cert files below don't exist yet):
#   sudo mkdir -p /var/www/perishflow /var/www/certbot
#   sudo certbot certonly --nginx -d perishflow.com -d www.perishflow.com
#   sudo cp deploy/nginx-perishflow.conf /etc/nginx/sites-available/perishflow.conf
#   sudo ln -s /etc/nginx/sites-available/perishflow.conf /etc/nginx/sites-enabled/
#   # remove perishflow.aflatus.com from the old server block (duplicate server_name otherwise)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Deploy the site: `npm run build`, then upload ./out to /var/www/perishflow, e.g.
#   rsync -av --delete out/ root@72.60.203.152:/var/www/perishflow/

# HTTP → HTTPS (all hostnames; keep /.well-known open for certbot renewals)
server {
    listen 80;
    listen [::]:80;
    server_name perishflow.com www.perishflow.com perishflow.aflatus.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.perishflow.com$request_uri; }
}

# Apex → www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name perishflow.com;

    ssl_certificate     /etc/letsencrypt/live/perishflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perishflow.com/privkey.pem;

    return 301 https://www.perishflow.com$request_uri;
}

# Old subdomain → new domain (uses the certificate perishflow.aflatus.com already has)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name perishflow.aflatus.com;

    ssl_certificate     /etc/letsencrypt/live/perishflow.aflatus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perishflow.aflatus.com/privkey.pem;

    return 301 https://www.perishflow.com$request_uri;
}

# Canonical site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.perishflow.com;

    ssl_certificate     /etc/letsencrypt/live/perishflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perishflow.com/privkey.pem;

    root /var/www/perishflow;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}
